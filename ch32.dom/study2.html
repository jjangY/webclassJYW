<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그의 속성 편집하기</title>
    <style>
        .b.on{
            background-color: red;
            color: #fff;
        }
    </style>
</head>
<body>
    <img src="./img/정현진.png" alt="정현진" class="a">
    <figcaption class="b">정현진</figcaption>
    <script>
        const img = document.querySelector('.a');
        // alert(img.getAttribute('src'));
        img.setAttribute('src','./img/장예원.png');
        // alert(img.getAttribute('src'));
        const figcaption =document.querySelector('.b');
        // alert(figcaption.textContent);
        // figcaption.innerText = '<i>장예원<i>';
        figcaption.innerHTML = '<i>장예원<i>';
        figcaption.classList.add('on');
        figcaption.classList.remove('on');
    </script>
    
    <ul class="list">
        <li>1</li>
        <li class="me">2</li>
        <li>3</li>
        <li>4</li>
    </ul>

    <script>
        let me = document.querySelector('.me');
        me.parentElement.style.border = '2px solid green';
        me.nextElementSibling.nextElementSibling.style.color = 'blue';
        me.previousElementSibling.style.color = 'pink';
        console.log(me.parentElement.previousElementSibling);
        let list = document.querySelector('.list');
        let listTags = list.children; // [{},{},{},{},...]
        listTags[0].style.color = 'red';
        me.parentElement.previousElementSibling.parentElement.children[0].
        setAttribute('src', './img/장예원.png');
        
    </script>
</body>
</html>
