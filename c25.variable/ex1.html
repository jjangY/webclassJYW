<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/ex1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적표</title>
</head>
<body>
    <script>
        let userName = prompt('당신의 이름을 입력해 주세요.')
        let scoreKo = Number(prompt('국어점수'))
        let scoreEn = Number(prompt('영어점수'))
        let scoreMath = Number(prompt('수학점수'))
        let scoreSc= Number(prompt('사회점수'))
        let scoreSum = scoreKo + scoreEn + scoreMath + scoreSc
        let scoreAver= (scoreSum/4).toFixed(2)
        document.write(`<table>
        <caption>${userName}님의 성적표</caption>
        <tr>
            <th>이름</th>
            <td>${userName}</td>
        </tr>
        <tr>
            <th>국어</th>
            <td>${scoreKo}점</td>
        </tr>
        <tr>
            <th>영어</th>
            <td>${scoreEn}점</td>
        </tr>
        <tr>
            <th>수학</th>
            <td>${scoreMath}점</td>
        </tr>
        <tr>
            <th>사회</th>
            <td>${scoreSc}점</td>
        </tr>
        <tr>
            <th>합계</th>
            <td>${scoreSum}점</td>
        </tr>
        <tr>
            <th>평균</th>
            <td>${scoreAver}점</td>
        </tr>
    </table>`)
    </script>
</body>
</html>
