<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마일 캐릭터 소개</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #fff9c4, #ffe0b2, #f8bbd0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 420px;
            background: rgba(255, 255, 255, 0.75);
            border: 3px solid #fff;
            border-radius: 30px;
            box-shadow: 0 18px 40px rgba(120, 80, 40, 0.2);
            padding: 30px 24px 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #ffb74d;
            color: #fff;
            font-weight: 700;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .character {
            position: relative;
            width: 220px;
            height: 240px;
            margin: 24px auto 16px;
        }

        .head {
            position: absolute;
            left: 50%;
            top: 30px;
            width: 150px;
            height: 150px;
            transform: translateX(-50%);
            background: #f9d9a7;
            border: 4px solid #2c2c2c;
            border-radius: 48% 52% 50% 50% / 55% 55% 45% 45%;
        }

        .hair {
            position: absolute;
            left: 50%;
            top: 10px;
            width: 170px;
            height: 80px;
            transform: translateX(-50%);
            background: #2d1a10;
            border-radius: 50% 50% 40% 40%;
            z-index: 2;
        }

        .hair::before,
        .hair::after {
            content: "";
            position: absolute;
            width: 52px;
            height: 52px;
            background: #2d1a10;
            border-radius: 50%;
            top: 20px;
        }

        .hair::before {
            left: 10px;
        }

        .hair::after {
            right: 10px;
        }

        .eye {
            position: absolute;
            top: 85px;
            width: 12px;
            height: 18px;
            background: #1d1d1d;
            border-radius: 50%;
            z-index: 3;
        }

        .eye.left { left: 82px; }
        .eye.right { right: 82px; }

        .blush {
            position: absolute;
            top: 118px;
            width: 18px;
            height: 12px;
            background: #ff9bb6;
            border-radius: 50%;
            opacity: 0.8;
            z-index: 2;
        }

        .blush.left { left: 58px; }
        .blush.right { right: 58px; }

        .smile {
            position: absolute;
            left: 50%;
            bottom: 46px;
            width: 54px;
            height: 28px;
            transform: translateX(-50%);
            border: 4px solid #2c2c2c;
            border-top: none;
            border-radius: 0 0 30px 30px;
            z-index: 3;
        }

        .body {
            position: absolute;
            left: 50%;
            bottom: 10px;
            width: 140px;
            height: 90px;
            transform: translateX(-50%);
            background: #6dc7ff;
            border: 4px solid #2c2c2c;
            border-radius: 25px 25px 18px 18px;
        }

        .arm {
            position: absolute;
            top: 150px;
            width: 18px;
            height: 72px;
            background: #f9d9a7;
            border: 4px solid #2c2c2c;
            border-radius: 14px;
        }

        .arm.left { left: 34px; transform: rotate(20deg); }
        .arm.right { right: 34px; transform: rotate(-20deg); }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #5b3a1d;
        }

        .tag {
            font-size: 14px;
            letter-spacing: 1px;
            color: #8a5d34;
            margin: 8px 0 18px;
            font-weight: 700;
        }

        .info {
            background: rgba(255,255,255,0.5);
            border-radius: 18px;
            padding: 16px 18px;
            margin-top: 10px;
            text-align: left;
        }

        .info p {
            margin: 8px 0;
            color: #4a3d32;
            line-height: 1.6;
        }

        strong {
            color: #d3567d;
        }
    </style>
    <link rel="stylesheet" href="./css/ex1.css">
    <script src="./js/ex1.js"></script>
</head>
<body>
    <div class="popup">
        <p><span id="popup-second">5</span>초 뒤에 자동으로 팝업이 닫힙니다.</p>
        <figure>
            <img src="./img/스텔라.jpg" alt="스텔라 캐릭터 이미지">
        </figure>
        <div class="controler">
            <span>오늘하루안보기</span>
            <span class="btn-close-popup">닫기</span>
        </div>
    </div>

    <div class="card">
        <div class="badge">MANGA HERO</div>

        <div class="character" aria-label="만화 캐릭터 그림">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="smile"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="body"></div>
        </div>

        <h1>루나 루미</h1>
        <div class="tag">빛을 사랑하는 달빛 소녀</div>

        <div class="info">
            <p><strong>특기:</strong> 하늘을 향해 꿈을 날리는 것</p>
            <p><strong>성격:</strong> 밝고 용감하며 친구들을 잘 도와주는 편</p>
            <p><strong>좌우명:</strong> "오늘의 작은 웃음이 내일의 큰 힘이 된다!"</p>
        </div>
    </div>
</body>
</html>
