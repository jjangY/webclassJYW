<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스와이퍼</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        .station1 {
            width: 700px;
            height: 350px;
            border: 1px solid red;
        }

        .station2 {
            width: 1200px;
            height: 800px;
            border: 1px solid blue;
        }

        .station2 .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="swiper station1">
        <div class="swiper-wrapper">
            <div class="swiper-slide">Slide 1</div>
            <div class="swiper-slide">Slide 2</div>
            <div class="swiper-slide">Slide 3</div>
            <div class="swiper-slide">Slide 4</div>
            <div class="swiper-slide">Slide 5</div>
        </div>
    </div>

    <div class="swiper station2">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="./img/김가온.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/김예림.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/김하경.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/김현아.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/박민주.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/배수정.png" alt=""></div>
            <div class="swiper-slide"><img src="./img/백민선.png" alt=""></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <script>
        const station1 = new Swiper('.station1', {
            loop: true,
            direction: 'vertical',
        });
        const station2 = new Swiper('.station2', {
            loop: true,
            slidesPerView: 1.2,
            autoplay: {
                delay: 5000,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>

</html>
